name: keepalive

# GitHub 은 60일간 커밋이 없으면 예약(cron) 워크플로를 자동 비활성화한다.
# (자동 토큰 커밋은 활동으로 잘 안 쳐주므로) 45일 이상 조용하면 빈 커밋을 찍어 살려둔다.
on:
  schedule:
    - cron: "0 3 * * 1" # 매주 월요일 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit empty if idle >= 45 days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "마지막 커밋 후 ${days}일"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent scheduled workflow suspension"
            git push
          else
            echo "최근 활동 있음 — keepalive 불필요"
          fi
