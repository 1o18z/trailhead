name: trailhead scan

# 한국시간 09:00 / 15:00 / 21:00 (UTC 00/06/12). 정각 혼잡을 피해 7분 offset.
on:
  schedule:
    - cron: "7 0,6,12 * * *"
  workflow_dispatch: {}

# 신규 제안을 이 레포에 PR 로 기록하려면 쓰기 권한 필요.
# 추가로 Settings → Actions → General → Workflow permissions 에서
# "Allow GitHub Actions to create and approve pull requests" 를 켜야 PR 생성이 됩니다.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trailhead-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      - name: Run scan and record proposals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          java -jar build/libs/trailhead-0.1.0.jar \
            --trailhead.mode=scan \
            --spring.main.web-application-type=none \
            --trailhead.pr.enabled=true \
            --trailhead.pr.repo=${{ github.repository }} \
            --trailhead.pr.base-branch=${{ github.ref_name }} \
            --spring.datasource.url=jdbc:h2:mem:scan
