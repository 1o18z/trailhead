name: trailhead scan

# 한국시간 09:00 / 15:00 / 21:00 (UTC 00/06/12). 정각 혼잡을 피해 7분 offset.
on:
  schedule:
    - cron: "7 0,6,12 * * *"
  workflow_dispatch:
    inputs:
      max_repos:
        description: "분석할 레포 수 (수동 실행 기본 5)"
        required: false
        default: "5"
      max_per_run:
        description: "생성할 PR 최대 수 (수동 실행 기본 3)"
        required: false
        default: "3"

# 신규 제안을 이 레포에 PR 로 기록하려면 쓰기 권한 필요.
# 추가로 Settings → Actions → General → Workflow permissions 에서
# "Allow GitHub Actions to create and approve pull requests" 를 켜야 PR 생성이 됩니다.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trailhead-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      - name: Run scan and record proposals
        env:
          # fork + 외부 PR 에는 사용자 PAT 가 필요. 없으면 기본 토큰으로 폴백(제안 기록만).
          GH_PAT: ${{ secrets.GH_PAT }}
          DEFAULT_TOKEN: ${{ github.token }}
          # 있으면 AI 변경 생성 활성화(SDK 가 이 키를 읽음). 없으면 설명만 기록.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_REPOS: ${{ github.event.inputs.max_repos }}
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run }}
        run: |
          export GITHUB_TOKEN="${GH_PAT:-$DEFAULT_TOKEN}"
          ARGS="--trailhead.mode=scan \
            --spring.main.web-application-type=none \
            --trailhead.pr.enabled=true \
            --trailhead.pr.repo=${{ github.repository }} \
            --trailhead.pr.base-branch=${{ github.ref_name }} \
            --spring.datasource.url=jdbc:h2:mem:scan"
          # 수동 실행(workflow_dispatch) 시에만 규모 제한 적용, 예약 실행은 앱 기본값 사용
          [ -n "$MAX_REPOS" ] && ARGS="$ARGS --trailhead.discovery.max-repos=$MAX_REPOS"
          [ -n "$MAX_PER_RUN" ] && ARGS="$ARGS --trailhead.pr.max-per-run=$MAX_PER_RUN"
          # API 키가 있을 때만 AI 변경 생성 켜기
          [ -n "$ANTHROPIC_API_KEY" ] && ARGS="$ARGS --trailhead.ai.enabled=true"
          java -jar build/libs/trailhead-0.1.0.jar $ARGS
