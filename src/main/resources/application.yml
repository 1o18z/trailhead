spring:
  application:
    name: trailhead
  datasource:
    url: jdbc:h2:file:./data/trailhead;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

server:
  port: 8080

trailhead:
  github:
    # gh 토큰을 그대로 넘겨 쓰면 됨: GITHUB_TOKEN 환경변수
    token: ${GITHUB_TOKEN:}
    base-url: https://api.github.com
  discovery:
    # 내 주력 언어 중심으로 레포 발굴
    languages:
      - kotlin
      - java
    min-stars: 100
    max-stars: 40000
    max-repos: 15
    pushed-within-days: 90
    require-contributing: true
    report-dir: ./reports
  signals:
    todo-enabled: true
    dependency-enabled: true
    code-smell-enabled: true
    # 실패 CI/테스트는 기여 조건에서 제외 (봇·인프라·플래키가 대부분)
    ci-enabled: false
    todo-markers:
      - TODO
      - FIXME
      - HACK
      - XXX
    max-per-repo: 20
    large-file-bytes: 60000
  grading:
    # HIGH 또는 MEDIUM. LOW(억지 제안)는 항상 버림
    min-tier: MEDIUM
  pr:
    enabled: false
    repo: ""
    base-branch: main
    max-per-run: 10
    max-open: 5
    one-per-repo: true
    branch-prefix: proposal
    candidates-dir: candidates
  ai:
    # 승인된 제안의 실제 코드 변경 생성 (Phase B). 키 있을 때만 켬.
    enabled: ${TRAILHEAD_AI_ENABLED:false}
    model: claude-opus-5-5
    effort: HIGH
    max-tokens: 16000
    max-file-bytes: 30000

logging:
  level:
    dev.enzi.trailhead: INFO
