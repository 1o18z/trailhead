<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>trailhead — 기여거리 제안</title>
    <style>
        :root { --bg:#0f1419; --card:#1a2029; --line:#2a323d; --text:#e6edf3; --muted:#8b96a5; --accent:#4ad295; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        header { padding:24px 32px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
        h1 { margin:0; font-size:20px; letter-spacing:.3px; }
        h1 span { color:var(--accent); }
        .sub { color:var(--muted); font-size:13px; margin-top:4px; }
        main { padding:24px 32px; }
        button { background:var(--accent); color:#06281b; border:none; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; font-size:14px; }
        button:hover { filter:brightness(1.08); }
        table { width:100%; border-collapse:collapse; margin-top:16px; }
        th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
        th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
        tr:hover td { background:var(--card); }
        a { color:#7aa7ff; text-decoration:none; }
        a:hover { text-decoration:underline; }
        .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
        .t-HIGH { background:#3d1a1a; color:#f2715e; }
        .t-MEDIUM { background:#123524; color:#4ad295; }
        .type { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:#22303d; color:#9fb4c7; }
        .repo { color:var(--muted); font-size:12px; }
        .detail { color:var(--muted); font-size:12px; margin-top:6px; max-width:620px; }
        .empty { color:var(--muted); padding:40px; text-align:center; }
        .meta { color:var(--muted); font-size:12px; }
    </style>
</head>
<body>
<header>
    <div>
        <h1><span>trail</span>head</h1>
        <div class="sub">오픈소스 레포에서 발굴한 기여거리 제안 (상/중만, 억지 제안 제외)</div>
    </div>
    <form method="post" th:action="@{/scan}">
        <button type="submit">지금 스캔 ▶</button>
    </form>
</header>
<main>
    <div class="meta">
        총 <span th:text="${total}">0</span>건 · HIGH <span th:text="${high}">0</span>건
    </div>

    <div th:if="${proposals.isEmpty()}" class="empty">
        아직 제안이 없어요. 우측 상단 <b>지금 스캔</b>을 눌러주세요.
    </div>

    <table th:unless="${proposals.isEmpty()}">
        <thead>
        <tr>
            <th>등급</th>
            <th>유형</th>
            <th>제안</th>
            <th>저장소</th>
            <th>근거</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${proposals}">
            <td><span class="badge" th:classappend="'t-' + ${p.tier}" th:text="${p.tier}">HIGH</span></td>
            <td><span class="type" th:text="${p.type}">BUG_FIX</span></td>
            <td>
                <div th:text="${p.title}">title</div>
                <div class="detail" th:text="${p.detail}">detail</div>
            </td>
            <td>
                <a th:href="${p.repoUrl}" target="_blank" th:text="${p.repoFullName}">repo</a>
                <div class="repo">⭐<span th:text="${p.stars}">0</span> · <span th:text="${p.language}">lang</span></div>
            </td>
            <td><a th:href="${p.evidenceUrl}" target="_blank">보기 ↗</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
