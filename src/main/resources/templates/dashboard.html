<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>trailhead — OSS 기여 후보</title>
    <style>
        :root { --bg:#0f1419; --card:#1a2029; --line:#2a323d; --text:#e6edf3; --muted:#8b96a5; --accent:#4ad295; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        header { padding:24px 32px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
        h1 { margin:0; font-size:20px; letter-spacing:.3px; }
        h1 span { color:var(--accent); }
        .sub { color:var(--muted); font-size:13px; margin-top:4px; }
        main { padding:24px 32px; }
        button { background:var(--accent); color:#06281b; border:none; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; font-size:14px; }
        button:hover { filter:brightness(1.08); }
        table { width:100%; border-collapse:collapse; margin-top:16px; }
        th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
        th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
        tr:hover td { background:var(--card); }
        a { color:#7aa7ff; text-decoration:none; }
        a:hover { text-decoration:underline; }
        .score { font-weight:700; font-variant-numeric:tabular-nums; }
        .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
        .b-AVAILABLE { background:#123524; color:#4ad295; }
        .b-TAKEN { background:#3a3410; color:#e8c23f; }
        .b-RISKY { background:#3d2410; color:#f29d4e; }
        .repo { color:var(--muted); font-size:12px; }
        .reasons { color:var(--muted); font-size:12px; margin:6px 0 0; padding-left:16px; }
        .empty { color:var(--muted); padding:40px; text-align:center; }
        .meta { color:var(--muted); font-size:12px; }
    </style>
</head>
<body>
<header>
    <div>
        <h1><span>trail</span>head</h1>
        <div class="sub">기여할 만한 오픈소스 이슈 — 중복·거절 PR 걸러낸 후보</div>
    </div>
    <form method="post" th:action="@{/discover}">
        <button type="submit">지금 탐색 ▶</button>
    </form>
</header>
<main>
    <div class="meta">
        총 <span th:text="${total}">0</span>건 분석 ·
        추천 <span th:text="${candidates.size()}">0</span>건 ·
        제외(해결됨) <span th:text="${skippedCount}">0</span>건
    </div>

    <div th:if="${candidates.isEmpty()}" class="empty">
        아직 후보가 없어요. 우측 상단 <b>지금 탐색</b>을 눌러주세요.
    </div>

    <table th:unless="${candidates.isEmpty()}">
        <thead>
        <tr>
            <th>점수</th>
            <th>상태</th>
            <th>이슈</th>
            <th>라벨</th>
            <th>⭐</th>
            <th>PR(열림/거절/머지)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${candidates}">
            <td class="score" th:text="${c.score}">0</td>
            <td><span class="badge" th:classappend="'b-' + ${c.status}" th:text="${c.status}">AVAILABLE</span></td>
            <td>
                <a th:href="${c.issueUrl}" target="_blank" th:text="${c.title}">title</a>
                <div class="repo">
                    <a th:href="${c.repoUrl}" target="_blank" th:text="${c.repoFullName}">repo</a>
                    #<span th:text="${c.issueNumber}">0</span> · <span th:text="${c.language}">lang</span>
                </div>
                <ul class="reasons">
                    <li th:each="r : ${c.reasons}" th:text="${r}">reason</li>
                </ul>
            </td>
            <td th:text="${c.matchedLabel}">label</td>
            <td th:text="${c.stars}">0</td>
            <td th:text="${c.openPrCount} + '/' + ${c.closedUnmergedPrCount} + '/' + ${c.mergedPrCount}">0/0/0</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
